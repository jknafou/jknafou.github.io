:root { --paper: #FBF8F4; --ink: #302E2E; --muted: #8C8682; }

.card h3 { margin: 0; font-weight: 400; font-size: 19px; } .card .meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
figure { margin: 0; } figcaption { color: var(--muted); font-size: 12px; text-align: center; margin-top: 4px; }

<p class="lede">Defined once in anim/anim.js and used by every slide.</p>

        sv.style.cursor = "pointer"; sv.addEventListener("click", go); 
      });
    });
  });
  var M = document.getElementById("motions");
  D.motions.forEach(function (m) {
    var card = document.createElement("section"); card.className = "card";
    card.innerHTML = "<h3></h3><div class='meta'></div><div class='row'></div>";

    M.appendChild(card);
    var svg;
    if (m.key === "camera") {                     /* a small stage: a 400 x 225 box that clips, its svg inside */
      var st = document.createElement("div"); st.style.cssText = "width:400px;height:225px;overflow:hidden;position:relative";
      svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 400 225"); svg.setAttribute("width", 400); svg.setAttribute("height", 225);
      svg.style.overflow = "visible"; svg.innerHTML = m.markup; st.appendChild(svg); card.querySelector(".row").appendChild(st);
    } else svg = draw(card.querySelector(".row"), m.markup, 1, "click to replay");
    var tr2 = null, go = function () { tr2 = tr2 || make(m.key, svg); if (tr2) play(tr2, svg); };
    svg.style.cursor = "pointer"; svg.addEventListener("click", go);
    
  });
  document.documentElement.setAttribute("data-ready", "1");
