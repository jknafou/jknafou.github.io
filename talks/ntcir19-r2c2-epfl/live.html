 'Times New Roman', serif" font-size="26" font-weight="400" text-anchor="start" fill="#302E2E">looked in his son's eyes and</text><text data-anim="type" x="46.8" y="419.89" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" text-anchor="start" fill="#302E2E">touched his son's face, before falling down a shaft towards</text><text data-anim="type" x="46.8" y="453.69" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" text-anchor="start" fill="#302E2E">the core of Starkiller Base to his death.</text></g><g data-a="fun-scene" data-concept="scene" data-scene="starkiller" data-cues="Prelude:0,Han:0.1,Ren:0.4,impaled:0.9,touched:1.5,falling:2.7,Starkiller:2.95" transform="translate(394.3,65.77) scale(1.1583)"><g data-act="pop" data-at="0" data-dur="0.5" data-o="19,19"><path d="M6,14L32,14L32,30L6,30Z" fill="#2A2A30" stroke="#1E1B1B" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M6,8L32,8L32,14L6,14Z" fill="#2A2A30" stroke="#1E1B1B" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M8,8L12,8L9,14L5,14Z" fill="#FFFFFF"/><path d="M14,8L18,8L15,14L11,14Z" fill="#FFFFFF"/><path d="M20,8L24,8L21,14L17,14Z" fill="#FFFFFF"/><path d="M26,8L30,8L27,14L23,14Z" fill="#FFFFFF"/></g><text x="40" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="12.26" font-style="italic" font-weight="bold" fill="#302E2E" data-act="key" data-at="0.05" data-dur="0">Star Wars: The Force Awakens (2015)</text><defs><clipPath id="sc13"><rect x="-2" y="34" width="304" height="233"/></clipPath></defs><g clip-path="url(#sc13)"><g transform="translate(0,38)"><defs><radialGradient id="core13" cx="0.5" cy="1" r="0.75"><stop offset="0" stop-color="#FF8A3D"/><stop offset="0.45" stop-color="#9C3B2A"/><stop offset="1" stop-color="#1F2230"/></radialGradient><clipPath id="skc13"><rect x="0" y="0" width="300" height="140"/><path d="M150,138L262,138L236,200L176,200Z"/></clipPath></defs><g data
