="#FBF8F4" stroke="#302E2E" stroke-width="3.5"/><g data-concept="reviewer"><circle cx="1180.08" cy="586.9" r="6.48" fill="#ECE6DE" stroke="#302E2E" stroke-width="2.36"/><path d="M1167.98,607.64C1167.98,595.54 1192.18,595.54 1192.18,607.64Z" fill="#ECE6DE" stroke="#302E2E" stroke-width="2.36" stroke-linejoin="round"/><path d="M1163.66,607.64L1205.14,607.64M1168.85,607.64L1168.85,618.87M1199.95,607.64L1199.95,618.87" fill="none" stroke="#302E2E" stroke-width="2.36" stroke-linecap="round"/><rect x="1188.72" y="590.36" width="12.96" height="16.42" rx="1.3" fill="#FBF8F4" stroke="#302E2E" stroke-width="1.89" transform="rotate(-8 1195.2 606.78)"/><path d="M1191.31,595.54L1198.66,594.68M1191.74,599.86L1197.36,599" fill="none" stroke="#8C8682" stroke-width="1.42" stroke-linecap="round"/></g><text x="1217.7" y="607.84" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" text-anchor="start" fill="#302E2E">opens the source</text></g></svg></div><p>The validated row, with the user (the reviewer figure, "the user") where the gate will stand, and the fork worded as the user's own judgement: "sure" to "used as is", "not sure" to "opens the source". The answer card has no gauge yet (its room left empty). Entry: the row in layers, the citation drawn down from the answer with it. Idle: the passage's line swept now and then (the source the doubtful user opens). 2.1: the user becomes the gate "≥ 70" (the figure fades, the gate pops in its place), the gauge grows to 94 in the answer, the fork's words re-keyed to yes / no and "a person reviews it".</p></figure><figure><figcaption><b>B</b> &middot; The user reads it; the source on the side</figcaption><div class="svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"><rect width="1600" height="900" fill="#FBF8F4"/><text x="100" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start" fill="#302E2E">An answer is
