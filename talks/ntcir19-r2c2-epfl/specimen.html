<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept bank</title>
<style>
:root { --paper: #FBF8F4; --ink: #302E2E; --muted: #8C8682; }
html, body { margin: 0; background: #EFEBE5; color: var(--ink); font: 15px/1.45 Georgia, 'Times New Roman', serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-weight: 400; font-size: 28px; margin: 8px 0 2px; } h2 { font-weight: 400; font-size: 20px; margin: 36px 0 10px; }
.lede { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--paper); border: 1px solid #DDD5CB; border-radius: 10px; padding: 16px 18px; margin: 14px 0; }
.card h3 { margin: 0; font-weight: 400; font-size: 19px; } .card .meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
figure { margin: 0; } figcaption { color: var(--muted); font-size: 12px; text-align: center; margin-top: 4px; }
svg { display: block; overflow: visible; }
button { font: inherit; font-size: 13px; border: 1px solid var(--ink); background: var(--paper); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
</style></head><body><main>

<p class="lede">Each concept alone, in the order the slides first use it, at whole size and at a third; then each shared motion of the animation bank, playing. Click a drawing to replay its motion.</p>

<p class="lede">Defined once in anim/anim.js and used by every slide.</p>
<div id="motions"></div>
