<script>
(function () {
  var K = 1, s = 0, raf = null, V = "T";
  var cap = document.getElementById("cap");
  function n() { return Live.steps(K); }
  function show() { cap.textContent = "slide 2, variant " + V + " (" + "the idea in words" + ") · " + (s ? "2." + s : "2") + "   → next, ← back, R replay"; }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = null; Live.stopLoop(); }
  function loop() { Live.startLoop(K, s); }
  function entry() { stop(); s = 0; show(); Live.playEntry(K).then(loop); }
  function fwd() {
    if (s >= n()) return;
    stop(); s++; show();
    var d = Live.info()[K - 1].steps[s - 1].enter, t0 = performance.now();
    (function tick(now) {
      var t = (now - t0) / 1000;
      if (t >= d) { Live.step(K, s); raf = null; loop(); return; }
      Live.stepEnter(K, s, t); raf = requestAnimationFrame(tick);
    })(t0);
  }
  function bwd() { stop(); s = Math.max(0, s - 1); show(); Live.step(K, s); loop(); }
  document.addEventListener("DOMContentLoaded", function () { Live.stopLoop(); Live.step(K, 0); });
  window.V2 = { stop: stop, get s() { return s; }, set: function (x) { stop(); s = x; show(); } };
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); fwd(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); bwd(); }
    else if (e.key === "r" || e.key === "R") entry();
  });
  document.addEventListener("click", fwd);
  window.addEventListener("load", function () {
    show();
    if (new URLSearchParams(location.search).get("capture") === "1") { stop(); Live.step(K, 0); return; }
    setTimeout(entry, 300);
  });
})();
</script>
