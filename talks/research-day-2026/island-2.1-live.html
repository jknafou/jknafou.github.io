  };
  /* the order each frame is drawn in: 08 makes the cells before 05 moves them */
  var ORDER = ["01", "02", "03", "06", "07", "10", "12", "13", "09", "11", "08", "05"];
  var REST = {
    "01": function (tl) { tl.data.rest(); }, "02": function (tl) { tl.data.rest(); },
    "03": function (tl) { tl.data.still(0); }, "05": function (tl) { tl.data.rest(); },
    "06": function (tl) { tl.data.restore(); }, "07": function (tl) { tl.restoreSigned(); },
    "08": function (tl) { tl.data.rest(); }, "09": function (tl) { tl.data.rest(); },
    "10": function (tl) { tl.data.rest(); }, "11": function (tl) { tl.data.rest(); },
    "12": function (tl) { tl.data.rest(); },
    "13": function (tl) { tl.data.rest(); }
  };

  var kids = [], decisions = [], scale = null, driver = null, clock = { t: 0 }, armedFrom = 0;

  function build(px) {
    destroy();
    scale = px;
    decisions = [];
    var gsap = G.gsap;
    /* ⚠️ THE BEAT TABLE IS PUBLISHED, AND IT HAD TO BE. Until 19 October 2026
     * the composer handed down `loop` and nothing else, so every module fell
     * back to its OWN copy of the beat starts -- which meant that changing the
     * tempo here would have left twelve modules telling the old story inside a
     * longer loop, each one silently out of step and none of them wrong by its
     * own reading. Each module is handed the table, the map of starts, and the
     * named start it already knows how to ask for; its own constants stay as
     * the fallback for a module built with no composer at all. */
    function o(extra) {
      var b = { scale: px, pxPerUnit: px, loop: L, L: L, reduced: false, log: say,
                beats: BEATS.map(function (x) { return [x[0], x[1]]; }), at: AT,
                beat1: AT["1 corpus in"], beat2: AT["2 extraction"],
                beat2b: AT["2b pour"], beat3: AT["3 tokenize"],
                beat4: AT["4 bucket"], beat5: AT["5 translate"],
                beat6: AT["6 decode"], beat7: AT["7 reconcile"],
                beat8: AT["8 corpus out"], beatsTotal: acc };
      for (var k in (extra || {})) b[k] = extra[k];
      return b;
    }
    var made = {};
    function make(id, extra, why) {
      var f = REG[id];
      if (typeof f !== "function") { decisions.push(id + ": module not loaded"); return null; }
      var tl = null;
      try { tl = f(svg, gsap, o(extra)); } catch (e) { say(id + " threw while building: " + e.message); tl = null; }
      made[id] = tl;
      decisions.push(id + ": " + (tl ? "built" : "returned null") + (why ? " (" + why + ")" : ""));
      return tl;
    }
    /* the English field moves as one part: the pour decides, SORT obeys */
    /* ⚠️ THE BEAT-LOCAL TUNING, WHICH IS WHERE THE SECOND TEMPO ACTUALLY LANDS.
     * Lengthening a beat in the table above does nothing on its own: every
     * module's own schedule is written in seconds INSIDE its beat, so a longer
     * beat 2 with the old numbers is the same animation followed by silence.
     * These are the numbers of 19 October 2026, and each says which of Julien's
     * four complaints it answers. */
    var B2 = AT["2 extraction"], B7 = AT["7 reconcile"];
    var m09 = make("09");
    make("11", { fieldRuns: !!(m09 && m09.data.runs) }, "fieldRuns tied to 09: " + !!(m09 && m09.data.runs));
    /* (2) the glyphs: 05 and 08 share one set of flight numbers, and they must
     * agree or the layer dies under a snake still carrying its cells */
    var FLIGHT = { first: 0.55, every: 0.72, flight: 1.45 };
    var m05 = make("05", FLIGHT, "beat 5 is 6.00 s: flight 1.45 s with a 0.40 s hold in the box");
    if (m05 && m05.data.tier === "whole")
      make("08", { step: 0.26, layerIn: 0.40, layerOut: 5.70, first: FLIGHT.first,
                   every: FLIGHT.every, flight: FLIGHT.flight },
           "05 runs, so its cells are needed; 0.26 s a character");
    else decisions.push("08: not built (05 is " + (m05 ? m05.data.tier : "absent") + ", so nothing would carry a cell)");
    /* (1a)(3) the two pages rest in the sea; (1b) the sea is cut with the page */
    var m03 = make("03", { riseIn: 0.80, travel: 1.20, reset: 0.70, sinkIn: 4.00 },
                   "the rest holds the fixed view; the loop opens by putting the source page back");
    if (m03 && m03.data.live)
      make("06", { closeScaleX: "endpoints", closeAt: 0.00, clear: 0.50,
                   openAt: 0.80, openDur: 0.40, stagger: 0.12,
                   order: "scatter", spread: 1.20 },
           "the sea is uncut from the start of the animation and opens scattered as the page rises");
    else decisions.push("06: not built (03 is stilled, so the sea would be cut under a page that never moves)");
    var d04 = G.motion04 && G.motion04.delays;
    /* ⚠️ THE ORDER INSIDE BEAT 7, WHICH A SCREENSHOT CAUGHT BACKWARDS. The page
     * was being filled from the table while the table was still unveiling its
     * own rows, so for a second the sentences arrived from somewhere that did
     * not yet have them. The beat now reads: the page rises (03, 0.00-1.20);
     * the translated rows unveil (10, 0.60-2.25); the page's lines fill from
     * them (07, 1.80-3.18); the rest of the sea refills on the inward wave
     * (07, from 2.80); the page sinks home (03, 4.00-5.20). */
    /* ⚠️ BEAT 7, AS THE AUTHOR DESCRIBED IT ON 19 OCTOBER 2026. The target page
     * is at full size from the start of the loop, so the beat no longer opens
     * by lifting it out; it opens by EMPTYING THE SEA OF LINES, which is what
     * makes the one abstract being written the only thing with words in it.
     * Then A' flows, the page fills from the table, and the rest of the corpus
     * fills in behind it in NO ORDER AT ALL while the page goes home.
     *   0.00        the sea empties of lines
     *   0.00-0.32   the page's own lines clear
     *   2.20        A' flows (motion 01)
     *   1.80-3.18   the page fills, top to bottom
     *   3.20-5.20   the corpus fills, scattered over 1.60 s, the last card
     *               landing exactly as the page does -- "gradually until the
     *               big document comes back to its place"
     *   4.00-5.20   the page goes home, under cover of the scatter
     * `order: "scatter"` is why 04's V5 `delays` is NOT handed over here: a
     * wave is exactly the trend he asked not to see. */
    var o07 = { heroClear: [0.00, 0.32], seaClearAt: 0.00, seaClear: 0.35,
                linesIn: 1.80, page: 0.40, stagger: 0.14,
                wave: 3.20, order: "scatter", spread: 1.60 };
    make("07", o07, "the sea empties at the beat's start and fills back scattered, with no wave");
    if (d04) decisions.push("04's V5 `delays` not used by 07: a wave is the trend the author asked not to see");
    decisions.push("04: not instantiated (its halves belong to 06 and 07; one writer per element)");
    make("01"); make("02");
    /* (1b) the structured rows wait until the cuts have finished opening */
    make("10", { clear2: [0.00, 0.50], unveil2: 2.30, stagger: 0.20, each: 0.45,
                 clear7: [0.00, 0.40], unveil7: 0.60 },
         "the rows unveil after the cuts, not across them");
    /* ⚠️ 12 IS NOT INSTANTIATED ANY MORE, AND THE REASON IS THE DRAWING.
     * COUNT-UNVEIL created `extract-sentence-count` at run time and hung it off
     * the extraction panel's subtitle with an em dash -- the smallest type in
     * the figure. Julien, 19 October 2026: "I want the number of sentences to
     * be placed at a better place, bigger and more highlighted." It is a drawn
     * chip now, in the measured free band on the right, and motion 13 counts
     * it. Two writers on one figure is the thing this composition refuses, so
     * the one that invented the element steps aside. */
    decisions.push("12: not instantiated (the sentence count is drawn now and 13 counts it)");
    /* the two piles build from the bottom and the three figures count up */
    make("13", { countFrom: B2 + 0.80, countFor: 1.25, deckGrow: 0.22, badgeFade: 0.30 },
         "the piles build in beats 1 and 8, the three figures count, all reset at the end of the rest");
    kids = ORDER.filter(function (id) { return made[id]; }).map(function (id) {
      return { id: id, tl: made[id] };
    });
    kids.forEach(function (k) {
      if (k.tl.duration() + 1e-6 < L) say(k.id + " has a period of " + k.tl.duration() + " s, shorter than the clock's " + L);
    });
    return kids.length;
  }

  function sync(t) {
    var armed = t >= armedFrom;
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (armed) k.tl.time(Math.min(t, k.tl.duration()), false);
      if (API.probe) API.probe(k.id, t);
    }
    if (!armed && t >= AT["8 corpus out"] + BEATS[8][1]) armedFrom = 0;   /* reached the rest: arm */
  }
  function rest() { kids.forEach(function (k) { REST[k.id](k.tl); }); }
  function destroy() {
    stop();
    kids.forEach(function (k) { k.tl.kill(); });
    kids = [];
  }

  function start(at) {
    if (reducedNow()) { say("reduced motion: the timeline is not started; the frame on screen is the signed one"); return false; }
    if (!kids.length) build(scale || measured());
    if (driver) return true;
    driver = G.gsap.timeline({ repeat: -1 });
    driver.fromTo(clock, { t: 0 }, { t: L, duration: L, ease: "none", immediateRender: false,
                                     onUpdate: function () { sync(clock.t); } });
    driver.time(at == null ? L - 1 : at);
    return true;
  }
  function stop() {
    if (driver) { driver.kill(); driver = null; }
    rest();
  }
  /* the camera settled at another scale: the old tier is put back now, the new
   * one is built on the same clock and armed from the next rest, so a tier
   * change never begins a story in the middle */
  function setScale(px) {
    var running = !!driver, at = running ? driver.time() : null;
    build(px);
    if (running) { armedFrom = Infinity; start(at); }
  }

  /* ================= STEP 6: THE CLICKABLE MAP ==========================
   * ⚠️ THIS COSTS ALMOST NOTHING BECAUSE STEP 5 ALREADY PAID FOR IT. At every
   * beat boundary the picture is exactly the signed one -- proved at all ten
   * boundaries over 2144 handles -- so a beat can be entered from `sync(0)`
   * and looped on its own without the rest of the story having run. Nothing
   * here animates anything: it only drives the SAME clock over a different
   * stretch of itself.
   *
   * ⚠️ AND THE ONE LIMITATION, NAMED RATHER THAN HIDDEN: a click loops a BEAT,
   * while the map's information/travel split was decided per MOTION. A beat
   * carries every motion that runs in it, so clicking the English deck replays
   * the flow along `route-in` beside the pile it is about. Mostly what comes
   * along is the reset that makes looping possible at all; the arrow is the
   * exception and it is the author's own example of travel. Splitting finer
   * means per-module suppression, which would leave a suppressed module's
   * parts wherever they stood -- worse than the thing it fixes. */
  var CMAP = (G.FIXED_CLICKABLE && G.FIXED_CLICKABLE.regions) || [];
  var hint = document.getElementById("fixed-live-hint");
  var focused = null, focusTl = null;

  var SPAN = {};                       /* beat label -> [start, end) on the loop */
  BEATS.forEach(function (b) { SPAN[b[0].split(" ")[0]] = [AT[b[0]], AT[b[0]] + b[1]]; });
  function spans(labels) {
    return (labels || []).map(function (l) { return SPAN[l]; }).filter(Boolean);
  }
  function total(ss) { return ss.reduce(function (a, w) { return a + (w[1] - w[0]); }, 0); }
  function walk(ss, u) {               /* a local second -> a second on the loop */
    for (var i = 0; i < ss.length; i++) {
      var d = ss[i][1] - ss[i][0];
      if (u < d) return ss[i][0] + u;
      u -= d;
    }
    return ss.length ? ss[ss.length - 1][1] - 1e-4 : 0;
  }
  function region(id) {
    for (var i = 0; i < CMAP.length; i++) if (CMAP[i].id === id) return CMAP[i];
    return null;
  }
  /* ⚠️ WHICH REGION A CLICK LANDED IN, BY GEOMETRY AND NOT BY ANCESTRY, and
   * that is a correction. Walking up from the clicked element looks right and
   * fails here: the stage chips are SIBLINGS of the text inside `bucket`, not
   * ancestors of it -- measured, the chain under the Tokenizer's own centre is
   * `text < g[bucket]` -- so a walk reaches `bucket` and never sees
   * `stage-tokenizer`, and every click in the translation panel focused the
   * whole panel. Found by dispatching a real mouse event rather than by
   * calling `focus()`, which would have proved the arithmetic and nothing
   * about whether a click can reach the part.
   * The SMALLEST box containing the point wins, so a chip beats the panel
   * holding it whatever the DOM says about who contains whom. */
  var HIT = [];
  function indexHits() {
    HIT = [];
    CMAP.forEach(function (r) {
      r.hit.forEach(function (n) {
        var el = svg.querySelector('[data-object="' + n + '"]');
        if (el) HIT.push({ r: r, el: el });
        else say("the clickable map names " + n + ", which is not in the drawing");
      });
    });
  }
  function hitRegion(x, y) {
    var best = null, area = Infinity;
    for (var i = 0; i < HIT.length; i++) {
      var b = HIT[i].el.getBoundingClientRect();
      if (x < b.left || x > b.right || y < b.top || y > b.bottom) continue;
      var a = b.width * b.height;
      if (a < area) { area = a; best = HIT[i].r; }
    }
    return best;
  }
  function say2(msg, on) {
    if (!hint) return;
    hint.textContent = msg || "";
    hint.className = on ? "on" : "";
  }

  function unfocus() {
    if (focusTl) { focusTl.kill(); focusTl = null; }
    focused = null;
    say2("", false);
    if (!reducedNow()) { driver = null; start(0); }
  }
  function focus(id) {
    var r = region(id);
    if (!r) return false;
    /* ⚠️ REDUCED MOTION NEVER LOOPS. It holds the last frame the region is
     * about, which still answers the question, and says so. */
    if (reducedNow()) {
      var one = spans(r.loop);
      if (one.length) sync(one[one.length - 1][1] - 1e-3);
      say2(r.name + " — held still, because motion is reduced", true);
      focused = r.id;
      return true;
    }
    var pre = spans(r.first), loop = spans(r.loop);
    if (!loop.length) return false;
    if (driver) { driver.kill(); driver = null; }
    if (focusTl) { focusTl.kill(); focusTl = null; }
    focused = r.id;
    sync(0);                           /* the one frame proved to be the signed picture */
    var k = { u: 0 };
    focusTl = G.gsap.timeline();
    if (pre.length) {
      focusTl.fromTo(k, { u: 0 }, { u: total(pre), duration: total(pre), ease: "none",
        immediateRender: false, onUpdate: function () { sync(walk(pre, k.u)); } });
    }
    var j = { u: 0 };
    focusTl.fromTo(j, { u: 0 }, { u: total(loop), duration: total(loop), ease: "none",
      repeat: -1, immediateRender: false, onUpdate: function () { sync(walk(loop, j.u)); } });
    say2(r.name + " — " + r.answers + "   ·   Esc for the whole tour", true);
    return true;
  }

  if (CMAP.length) {
    /* the affordance: only the parts a click does something to get a pointer */
    CMAP.forEach(function (r) {
      r.hit.forEach(function (n) {
        var el = svg.querySelector('[data-object="' + n + '"]');
        if (el) el.setAttribute("data-clickable", r.id);
      });
    });
    indexHits();
    svg.addEventListener("click", function (e) {
      var r = hitRegion(e.clientX, e.clientY);
      if (!r) { if (focused) unfocus(); return; }
      if (r.id === focused) return;
      focus(r.id);
    });
    /* ⚠️ DOUBLE CLICK IS WIRED AND INERT UNTIL STEP 9 BUILDS A SLIDE. It fires
     * an event rather than doing nothing silently, and says so, because an
     * affordance that is promised and absent is worse than one never offered. */
    svg.addEventListener("dblclick", function (e) {
      var r = hitRegion(e.clientX, e.clientY);
      if (!r) return;
      G.dispatchEvent(new CustomEvent("fixedlive:open", { detail: { region: r.id, name: r.name } }));
      /* ⚠️ THIS SAID "its slide is step 9's and is not built yet" AND WAS FALSE
         TWICE, corrected 20 October 2026: step 8 is THE BUILD, step 9 is the
         world's arrangement -- and this island's DYNAMIC-VIEW.md is signed, so
         the slides DO exist. `house_compose.py` carries a microtask whose only
         job is to blank this sentence after the fact, which is a house file
         working around an island file rather than the island telling the
         truth. */
      say2(r.name + " — double click opens its slide", true);
    });
    G.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && focused) unfocus();
    });
  }

  var API = G.FixedLive = {
    focus: focus, unfocus: unfocus, regions: CMAP,
    get focused() { return focused; },
    L: L, beats: BEATS, at: AT, boundaries: BOUNDARIES, seams: SEAMS,
    build: build, start: start, stop: stop, rest: rest, setScale: setScale, sync: sync,
    destroy: destroy, reducedNow: reducedNow,
    get scale() { return scale; }, get children() { return kids; },
    get decisions() { return decisions.slice(); }, get running() { return !!driver; },
    get driver() { return driver; }, log: LOG, probe: null
  };

  /* ---- boot ---- */
  var s = parseFloat(params.get("scale"));
  if (s > 0) place(s);
  if (reducedNow()) { say("reduced motion: nothing is built and nothing is started"); }
  else {
    build(s > 0 ? s : measured());
    var auto = params.get("autostart") !== "0";
    var seen = true;
    function decide() {
      if (!auto) return;
      if (reducedNow()) { stop(); return; }
      if (seen && document.visibilityState !== "hidden") start(); else stop();
    }
    if (G.IntersectionObserver) {
      new IntersectionObserver(function (es) { seen = es[es.length - 1].isIntersecting; decide(); }).observe(svg);
    }
    document.addEventListener("visibilitychange", decide);
    if (mq && mq.addEventListener) mq.addEventListener("change", decide);
    if (!(s > 0)) G.addEventListener("resize", function () { if (kids.length) setScale(measured()); });
    G.addEventListener("resize", function () { if (CMAP.length) indexHits(); });
    decide();
  }
})(window);

</script>
</body></html>
